name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.2.0)'
        required: true
        default: 'v4.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows x64 Setup EXE, Portable ZIP & Publish Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: meta
        shell: powershell
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build, self-test, and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\ci\release-package.ps1 -Tag "${{ steps.meta.outputs.tag }}" -Repository "${{ github.repository }}"
