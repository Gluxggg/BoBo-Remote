name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-selftest:
    name: Compile and self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 编译与自检逻辑放在 ci/build.ps1（UTF-8 带 BOM）里：
      # Windows PowerShell 5.1 会把 workflow 内联的无 BOM 脚本按 ANSI 解析，
      # 中文会变乱码并触发语法错误。
      - name: Build with in-box csc.exe and run --self-test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\ci\build.ps1

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DualRemote-exe
          path: ci-out/DualRemote.exe
          if-no-files-found: warn
          retention-days: 7
