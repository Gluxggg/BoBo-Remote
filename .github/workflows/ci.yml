name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 (BoBoCore + BoBoRemote + Golden Tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/bobo-tsnet/go.mod
          cache: true
          cache-dependency-path: native/bobo-tsnet/go.sum

      - name: Test tools/bobo-relay
        shell: powershell
        run: |
          Push-Location tools/bobo-relay
          try { go test -v ./...; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }

      - name: Build BoBoCore.dll + BoBoTsNet.exe + BoBoRemote.exe and run --self-test
        shell: powershell
        run: .\ci\build.ps1

      - name: Upload Windows EXE Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BoBoRemote-Windows-x64
          path: ci-out/BoBoRemote.exe
          if-no-files-found: warn
          retention-days: 7

  android-apk:
    name: Android APK (Kotlin + Compose + Golden & TLS Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Stage release keystore when secret is available
        env:
          KEYSTORE_B64: ${{ secrets.BOBO_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bobo-release.p12"
            chmod 600 "$RUNNER_TEMP/bobo-release.p12"
            echo "BOBO_UPLOAD_STORE_FILE=$RUNNER_TEMP/bobo-release.p12" >> "$GITHUB_ENV"
          fi

      - name: Run BoBo6.2 Golden Vector & TLS 1.2 Loopback Tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble Android APK
        working-directory: android
        env:
          BOBO_UPLOAD_STORE_PASSWORD: ${{ secrets.BOBO_ANDROID_KEYSTORE_PASSWORD }}
          BOBO_UPLOAD_KEY_ALIAS: ${{ secrets.BOBO_ANDROID_KEY_ALIAS }}
          BOBO_UPLOAD_KEY_PASSWORD: ${{ secrets.BOBO_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Clean temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bobo-release.p12"

      - name: Copy Named Android APK
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/BoBoRemote-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoBoRemote-Android-APK
          path: dist-android/BoBoRemote-Android.apk
          if-no-files-found: error
          retention-days: 14

  apple-core-and-macos:
    name: Apple Core Tests + macOS App & DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test BoBoAppleCore (Golden Vectors + RSA-2048 X.509/PKCS12 + TLS 1.2 Loopback)
        working-directory: apple/BoBoAppleCore
        run: swift test -v

      - name: Build BoBoRemote.app & Package BoBoRemote-macOS.dmg
        run: bash apple/scripts/package-macos-dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoBoRemote-macOS-DMG
          path: dist-apple/BoBoRemote-macOS.dmg
          if-no-files-found: error
          retention-days: 14

  ios-ipa:
    name: iOS / iPadOS Unsigned IPA (App + ReplayKit Extension)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Build & Package BoBoRemote-iOS-Unsigned.ipa
        run: bash apple/scripts/package-ios-ipa.sh

      - name: Upload iOS Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoBoRemote-iOS-IPA
          path: dist-apple/BoBoRemote-iOS-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
