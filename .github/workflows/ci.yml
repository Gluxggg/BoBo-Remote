name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-selftest:
    name: Build V6 All-In-One (BoBoCore + BoBoRemote) and Self-Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 编译内嵌原生核 BoBoCore.dll.gz -> 嵌入 BoBoRemote.exe -> 运行端到端自检与安装向导自检
      - name: Build BoBoCore.dll + BoBoRemote.exe and run --self-test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\ci\build.ps1

      - name: Upload V6 All-In-One build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BoBoRemote-v6-allinone-exe
          path: ci-out/BoBoRemote.exe
          if-no-files-found: warn
          retention-days: 7
