<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="BoBo远程">
  <defs>
    <linearGradient id="boboDeep" x1="12%" y1="8%" x2="72%" y2="92%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="boboUpper" x1="10%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2E6BE6"/>
    </linearGradient>
    <linearGradient id="boboLower" x1="0%" y1="15%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="boboCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>
  <!-- Left structural spine prism -->
  <polygon points="20,14 48,26 48,70 20,82" fill="url(#boboDeep)"/>
  <!-- Upper-right kinetic crystal lobe (forms upper loop of B & twin link) -->
  <polygon points="48,10 78,28 52,48 34,36" fill="url(#boboUpper)"/>
  <!-- Lower-right kinetic crystal lobe (forms lower loop of B & dual stream) -->
  <polygon points="34,60 52,48 80,68 48,86" fill="url(#boboLower)"/>
  <!-- Luminous center interlocking facet -->
  <polygon points="34,36 52,48 34,60 20,48" fill="url(#boboCore)" opacity="0.92"/>
  <!-- Crisp right highlight facet -->
  <polygon points="52,48 78,28 66,48 80,68" fill="#60A5FA" opacity="0.35"/>
</svg>
